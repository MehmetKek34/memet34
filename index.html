<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Heart ❤️</title>
<style>
* { box-sizing: border-box; }
html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #060208;
    overflow: hidden;
}
body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
}
canvas {
    display: block;
    width: min(100vw, 800px, 100vh);
    height: min(100vw, 800px, 100vh);
    height: min(100vw, 800px, 100dvh);
}
</style>
</head>
<body>
<canvas id="heart" width="800" height="800" aria-label="Words forming an animated heart"></canvas>
<script>
(() => {
    const canvas = document.getElementById("heart");
    const ctx = canvas.getContext("2d");

    const SCALE = 21;
    const OY = 20;
    const DURATION = 10000;
    const TICK = 16;
    const ANIM = 42;
    const LIFT = 34;
    const GAP = 7;
    const SIZES = [9, 10, 11, 12];
    const FONT = "Arial";
    const BG = "#060208";

    const PHRASES = [
        "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
        "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
        "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
        "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
        "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
    ];

    const rng = (() => {
        // Seeded random generator for a repeatable layout.
        let seed = 11;
        return () => {
            seed = (seed * 1664525 + 1013904223) >>> 0;
            return seed / 4294967296;
        };
    })();

    const random = (min, max) => min + rng() * (max - min);
    const clamp = value => Math.max(0, Math.min(1, value));
    const mix = (a, b, k) => a.map((value, i) => value + (b[i] - value) * k);
    const dim = (color, k) => color.map(value => value * k);
    const BGC = [6 / 255, 2 / 255, 8 / 255];
    const FLASH = [1, 0.78, 0.78];

    function toHex(color) {
        return "#" + color.map(value =>
            Math.round(clamp(value) * 255).toString(16).padStart(2, "0")
        ).join("");
    }

    function heart(angle) {
        const x = 16 * Math.pow(Math.sin(angle), 3);
        const y = 13 * Math.cos(angle)
            - 5 * Math.cos(2 * angle)
            - 2 * Math.cos(3 * angle)
            - Math.cos(4 * angle);
        return [x * SCALE, y * SCALE + OY];
    }

    const POLY = Array.from({ length: 720 }, (_, i) =>
        heart(2 * Math.PI * i / 720)
    );
    const EDGES = POLY.map((point, i) => [point, POLY[(i + 1) % POLY.length]]);
    const YMAX = Math.max(...POLY.map(point => point[1]));
    const YMIN = Math.min(...POLY.map(point => point[1]));
    const CY = (YMAX + YMIN) / 2;

    function spans(y) {
        const xs = [];
        for (const [[x1, y1], [x2, y2]] of EDGES) {
            if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
                xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
            }
        }
        xs.sort((a, b) => a - b);
        const result = [];
        for (let i = 0; i < xs.length; i += 2) {
            if (xs[i + 1] !== undefined) result.push([xs[i], xs[i + 1]]);
        }
        return result;
    }

    function intersect(aSpans, bSpans) {
        const result = [];
        for (const a of aSpans) {
            for (const b of bSpans) {
                const lo = Math.max(a[0], b[0]);
                const hi = Math.min(a[1], b[1]);
                if (hi - lo > 14) result.push([lo, hi]);
            }
        }
        return result;
    }

    function mathDistance(x, y) {
        return Math.hypot(x / (16 * SCALE), (y - CY) / (14.5 * SCALE));
    }

    function phraseCycle() {
        let order = [];
        let index = 0;
        return () => {
            if (index >= order.length) {
                order = PHRASES.slice();
                // Seeded Fisher-Yates shuffle.
                for (let i = order.length - 1; i > 0; i--) {
                    const j = Math.floor(rng() * (i + 1));
                    [order[i], order[j]] = [order[j], order[i]];
                }
                index = 0;
            }
            return order[index++];
        };
    }

    function build() {
        const nextPhrase = phraseCycle();
        const rowHeight = 17;
        const placed = [];

        for (let y = YMAX - rowHeight / 2; y > YMIN + rowHeight / 2; y -= rowHeight) {
            const row = intersect(spans(y + rowHeight / 2), spans(y - rowHeight / 2));

            for (const [left, right] of row) {
                const lo = left + 4;
                const hi = right - 4;
                let current = lo + random(0, 8);
                const line = [];

                while (true) {
                    let fit = null;
                    for (let attempt = 0; attempt < 10; attempt++) {
                        const text = nextPhrase();
                        const size = SIZES[Math.floor(rng() * SIZES.length)];
                        ctx.font = `bold ${size}px ${FONT}`;
                        const width = ctx.measureText(text).width;
                        if (current + width <= hi) {
                            fit = { text, size, width };
                            break;
                        }
                    }
                    if (!fit) break;

                    line.push({
                        x: current + fit.width / 2,
                        text: fit.text,
                        size: fit.size,
                        width: fit.width
                    });
                    current += fit.width + GAP;
                }

                if (!line.length) continue;

                if (line.length > 1) {
                    const remaining = hi - (line[line.length - 1].x + line[line.length - 1].width / 2);
                    line.forEach((item, i) => {
                        item.x += remaining * i / (line.length - 1);
                    });
                } else {
                    line[0].x = (lo + hi) / 2;
                }

                line.forEach((item, i) => {
                    const edge = i === 0 || i === line.length - 1;
                    const radius = Math.min(1, mathDistance(item.x, y));
                    let color = mix([0.58, 0, 0.09], [0.90, 0.05, 0.14], 0.25 + 0.75 * radius);
                    color = mix(
                        color,
                        [0.98, 0.10, 0.16],
                        random(0, 0.35) + (edge ? 0.3 : 0)
                    );
                    placed.push({
                        ...item,
                        y,
                        edge,
                        color: color.map(v => Math.min(1, v)),
                        radius,
                        frame: 0,
                        dx: random(-10, 10)
                    });
                });
            }
        }

        const edges = placed.filter(item => item.edge);
        const inner = placed.filter(item => !item.edge);
        edges.sort((a, b) =>
            (Math.atan2(a.x, a.y - CY) % (2 * Math.PI)) -
            (Math.atan2(b.x, b.y - CY) % (2 * Math.PI))
        );
        inner.sort((a, b) => b.radius - a.radius);
        return edges.concat(inner);
    }

    function drawText(item, x, y, color, size = item.size) {
        ctx.font = `bold ${size}px ${FONT}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = color;
        ctx.fillText(item.text, x, y);
    }

    const ORDER = build();
    let nextIndex = 0;
    let active = [];
    let allItems = [];
    let accumulator = 0;
    const rate = ORDER.length / (DURATION / TICK);
    let lastTime = 0;
    let elapsed = 0;
    let finished = false;
    let shimmerIndex = 0;
    let shimmerUntil = 0;

    function spawn(item) {
        active.push(item);
        allItems.push(item);
    }

    function animate(item) {
        item.frame++;
        const u = clamp(item.frame / ANIM);
        const eased = 1 - Math.pow(1 - u, 3);
        const x = 400 + item.x + item.dx * (1 - eased);
        const y = 400 - item.y - (1 - eased) * LIFT;
        const color = item.color;

        drawText(item, x + 2, y + 3, toHex(mix(BGC, dim(color, 0.30), eased)));
        drawText(item, x, y, toHex(mix(BGC, dim(color, 0.20), eased * eased)), item.size + 1);

        const flash = 0.75 * Math.sin(Math.PI * clamp((u - 0.55) / 0.45));
        const mainColor = mix(mix(BGC, color, Math.pow(eased, 1.5)), FLASH, flash);
        drawText(item, x, y, toHex(mainColor));

        return u < 1;
    }

    function drawFinishedHeart(time) {
        // Keep every word visible once the build animation is complete.
        for (const item of allItems) {
            drawText(item, 400 + item.x, 400 - item.y, toHex(item.color));
        }

        if (time >= shimmerUntil && allItems.length) {
            shimmerIndex = Math.floor(rng() * allItems.length);
            shimmerUntil = time + 260;
        }

        if (allItems.length) {
            const item = allItems[shimmerIndex];
            drawText(
                item,
                400 + item.x,
                400 - item.y,
                toHex(mix(item.color, FLASH, 0.6))
            );
        }
    }

    function frame(time) {
        if (!lastTime) lastTime = time;
        const delta = Math.min(50, time - lastTime);
        lastTime = time;
        elapsed += delta;

        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, 800, 800);

        if (!finished) {
            accumulator += rate * delta / TICK;
            while (accumulator >= 1 && nextIndex < ORDER.length) {
                spawn(ORDER[nextIndex++]);
                accumulator -= 1;
            }
            if (nextIndex >= ORDER.length) finished = true;
        }

        active = active.filter(animate);

        if (finished && active.length === 0) {
            drawFinishedHeart(elapsed);
        }

        requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
